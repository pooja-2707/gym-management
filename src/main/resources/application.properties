# =============================================
# APPLICATION NAME & SERVER PORT
# =============================================
spring.application.name=GymManagement
server.port=8080

# =============================================
# MYSQL DATABASE CONFIGURATION
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Abhinav
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE SETTINGS (MySQL)
# =============================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# =============================================
# THYMELEAF SETTINGS
# =============================================
spring.thymeleaf.cache=false

# =============================================
# SQL INITIALIZATION (DISABLED)
# =============================================
spring.sql.init.mode=never
