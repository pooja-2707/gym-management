# =============================================
# APPLICATION NAME & SERVER PORT
# =============================================
spring.application.name=GymManagement
server.port=8080

# =============================================
# MYSQL DATABASE CONFIGURATION
# =============================================
# Tells Spring Boot to connect to MySQL database 'gym_management_db'
# createDatabaseIfNotExist=true creates the database automatically if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/gym_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Pooja@9219
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# HIBERNATE / JPA SETTINGS FOR MYSQL
# =============================================
# 'update' automatically creates/updates MySQL tables from Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# THYMELEAF SETTINGS
# =============================================
spring.thymeleaf.cache=false
