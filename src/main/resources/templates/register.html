<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | GymPro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        body {
            background: var(--board);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: var(--paper);
            border: 1px solid var(--board-line);
            border-radius: 8px;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            box-shadow: 0 4px 20px rgba(32, 33, 29, 0.05);
        }
        .auth-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .auth-brand svg {
            width: 32px;
            height: 32px;
        }
        .auth-brand span {
            font-family: 'Anton', sans-serif;
            font-size: 26px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--ink);
        }
        .auth-brand .accent {
            color: var(--plate-yellow);
        }
        .auth-sub {
            text-align: center;
            font-size: 13.5px;
            color: var(--muted);
            margin-bottom: 24px;
        }
        .form-label-board {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ink);
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }
        .form-control-board {
            background: #ffffff;
            border: 1px solid var(--board-line);
            border-radius: 4px;
            padding: 10px 14px;
            font-size: 14px;
            color: var(--ink);
            width: 100%;
            transition: border-color 0.15s ease;
        }
        .form-control-board:focus {
            outline: none;
            border-color: var(--plate-blue);
            box-shadow: 0 0 0 3px rgba(46, 95, 138, 0.15);
        }
        .btn-auth {
            background: var(--ink);
            color: var(--board);
            border: none;
            padding: 11px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }
        .btn-auth:hover {
            opacity: 0.92;
            color: var(--board);
        }
        .auth-footer {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--board-line);
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        .auth-footer a {
            color: var(--plate-blue);
            font-weight: 600;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .alert-board {
            border: 1px solid var(--board-line);
            border-radius: 4px;
            font-size: 13px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="#20211d" stroke-width="2"><path d="M4 8v8M2 10v4M8 6v12M20 8v8M22 10v4M16 6v12" stroke-linecap="round"/></svg>
            <span>GYM<span class="accent">PRO</span></span>
        </div>
        <div class="auth-sub">Register a new administrator account</div>

        <div th:if="${errorMessage}" class="alert-board bg-danger bg-opacity-10 text-danger border-danger border-opacity-25" th:text="${errorMessage}">
            Error message
        </div>

        <form th:action="@{/register}" method="post">
            <div class="mb-3">
                <label class="form-label-board">Username</label>
                <input type="text" name="username" th:value="${username}" class="form-control-board" placeholder="Choose username" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label-board">Email Address</label>
                <input type="email" name="email" th:value="${email}" class="form-control-board" placeholder="name@gympro.com">
            </div>

            <div class="mb-3">
                <label class="form-label-board">Password</label>
                <input type="password" name="password" class="form-control-board" placeholder="Enter password" required>
            </div>

            <div class="mb-3">
                <label class="form-label-board">Confirm Password</label>
                <input type="password" name="confirmPassword" class="form-control-board" placeholder="Confirm password" required>
            </div>

            <button type="submit" class="btn-auth">
                <span>Create Account</span> →
            </button>
        </form>

        <div class="auth-footer">
            <div class="mb-2">Already have an account?</div>
            <div>
                <a th:href="@{/login}">Back to Login →</a>
            </div>
        </div>
    </div>

</body>
</html>
