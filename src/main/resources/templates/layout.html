<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gym Membership Management System - Manage members, plans, payments, and more.">
    <title th:text="${pageTitle} != null ? ${pageTitle} + ' | Gym Management' : 'Gym Management'">Gym Management</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

    <nav class="sidebar d-flex flex-column justify-content-between">
        <div>
            <div class="sidebar-brand">
                <h3><i class="bi bi-trophy-fill"></i> <span>GymPro</span></h3>
            </div>
            
            <ul class="sidebar-menu">
                <li>
                    <a th:href="@{/}" th:classappend="${activePage == 'dashboard'} ? 'active' : ''">
                        <i class="bi bi-grid-1x2-fill"></i> <span>Dashboard</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/members}" th:classappend="${activePage == 'members'} ? 'active' : ''">
                        <i class="bi bi-people-fill"></i> <span>Members</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/plans}" th:classappend="${activePage == 'plans'} ? 'active' : ''">
                        <i class="bi bi-card-checklist"></i> <span>Plans</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/subscriptions}" th:classappend="${activePage == 'subscriptions'} ? 'active' : ''">
                        <i class="bi bi-bookmark-star-fill"></i> <span>Subscriptions</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/payments}" th:classappend="${activePage == 'payments'} ? 'active' : ''">
                        <i class="bi bi-credit-card-fill"></i> <span>Payments</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/trainers}" th:classappend="${activePage == 'trainers'} ? 'active' : ''">
                        <i class="bi bi-person-badge-fill"></i> <span>Trainers</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/attendance}" th:classappend="${activePage == 'attendance'} ? 'active' : ''">
                        <i class="bi bi-calendar-check-fill"></i> <span>Attendance</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/reports}" th:classappend="${activePage == 'reports'} ? 'active' : ''">
                        <i class="bi bi-bar-chart-line-fill"></i> <span>Reports</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="p-3 border-top border-secondary border-opacity-25">
            <a th:href="@{/logout}" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
            </a>
        </div>
    </nav>

    <div class="main-content">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}">Success message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}">Error message</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:insert="~{:: #page-content}">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
