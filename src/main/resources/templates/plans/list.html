<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">

    <div class="top-header">
        <div>
            <h2>Membership Plans</h2>
            <span class="breadcrumb">Manage gym pricing & durations</span>
        </div>
        <a th:href="@{/plans/add}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Add Plan
        </a>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-lg-3" th:each="plan : ${plans}">
            <div class="content-card h-100 p-4 d-flex flex-column justify-content-between text-center border shadow-sm rounded-4">
                <div>
                    <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill mb-3 fw-semibold" th:text="${plan.durationInMonths} + ' Month(s)'">1 Month</span>
                    <h3 class="fw-bold text-dark mb-2" th:text="${plan.planName}">Monthly</h3>
                    <h2 class="display-6 fw-bold text-primary mb-3">
                        ₹<span th:text="${#numbers.formatDecimal(plan.price, 1, 0)}">1,000</span>
                    </h2>
                </div>
                <div class="d-flex justify-content-center gap-2 mt-4 pt-3 border-top">
                    <a th:href="@{/plans/edit/{id}(id=${plan.id})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil me-1"></i> Edit
                    </a>
                    <a th:href="@{/plans/delete/{id}(id=${plan.id})}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this plan?')">
                        <i class="bi bi-trash me-1"></i> Delete
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(plans)}" class="col-12 text-center py-5">
            <p class="text-muted">No membership plans available.</p>
        </div>
    </div>

</div>
</body>
</html>
