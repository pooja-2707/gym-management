<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">
    <!-- Page Title + Actions -->
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="font-headline-xl text-headline-xl text-primary">Plans Management</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">Manage gym pricing &amp; membership tiers.</p>
        </div>
        <a th:href="@{/plans/add}" class="btn-primary-neon no-underline">
            <span class="material-symbols-outlined text-[18px]">add</span>
            Add Plan
        </a>
    </div>

    <!-- Plans Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-gutter">
        <div th:each="plan : ${plans}" class="glass-panel rounded-xl p-6 flex flex-col justify-between transition-all duration-300 hover:border-primary-fixed/30 hover:shadow-[0px_0px_40px_rgba(195,244,0,0.1)] group relative overflow-hidden">
            <!-- Glow effect -->
            <div class="absolute top-0 right-0 w-24 h-24 bg-primary-fixed/5 rounded-full blur-2xl -mr-12 -mt-12 group-hover:bg-primary-fixed/15 transition-all"></div>

            <div class="text-center relative z-10">
                <!-- Duration Badge -->
                <span class="inline-flex items-center gap-1 bg-primary-fixed/10 text-primary-fixed px-3 py-1 rounded-full font-label-sm text-label-sm border border-primary-fixed/20 mb-4">
                    <span class="material-symbols-outlined text-[14px]">schedule</span>
                    <span th:text="${plan.durationInMonths} + ' Month(s)'">1 Month</span>
                </span>

                <!-- Plan Name -->
                <h3 class="font-headline-md text-headline-md text-primary font-bold mb-4" th:text="${plan.planName}">Monthly</h3>

                <!-- Price -->
                <div class="mb-6">
                    <span class="text-on-surface-variant text-[20px]">₹</span>
                    <span class="font-headline-xl text-headline-xl text-primary-fixed font-bold" th:text="${#numbers.formatDecimal(plan.price, 1, 0)}">1,000</span>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex justify-center gap-3 pt-4 border-t border-white/10 relative z-10">
                <a th:href="@{/plans/edit/{id}(id=${plan.id})}" class="btn-ghost-neon no-underline text-[12px]">
                    <span class="material-symbols-outlined text-[16px]">edit</span>
                    Edit
                </a>
                <a th:href="@{/plans/delete/{id}(id=${plan.id})}" class="btn-danger-neon no-underline text-[12px]"
                   onclick="return confirm('Delete this plan?')">
                    <span class="material-symbols-outlined text-[16px]">delete</span>
                    Delete
                </a>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(plans)}" class="col-span-full text-center py-16">
            <span class="material-symbols-outlined text-[64px] text-on-surface-variant/20 mb-4">style</span>
            <p class="font-body-md text-on-surface-variant">No membership plans available.</p>
            <a th:href="@{/plans/add}" class="btn-primary-neon no-underline mt-4 inline-flex">
                <span class="material-symbols-outlined text-[18px]">add</span>
                Create First Plan
            </a>
        </div>
    </div>
</div>
</body>
</html>
