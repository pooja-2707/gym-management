<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="font-headline-xl text-headline-xl text-primary" th:text="${plan.id != null} ? 'Edit Plan' : 'Add Membership Plan'">Add Plan</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">
                <a th:href="@{/plans}" class="text-secondary-fixed hover:text-secondary no-underline">Plans</a> / Form
            </p>
        </div>
    </div>
    <div class="glass-panel rounded-xl p-8 max-w-[600px]">
        <form th:action="@{/plans/save}" th:object="${plan}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="flex flex-col gap-6">
                <div>
                    <label class="glass-label">Plan Name <span class="text-error">*</span></label>
                    <input type="text" class="glass-input" th:field="*{planName}" placeholder="e.g. Quarterly Plan"
                           th:classappend="${#fields.hasErrors('planName')} ? 'border-error/50' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('planName')}" th:errors="*{planName}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Duration (in Months) <span class="text-error">*</span></label>
                    <input type="number" class="glass-input" th:field="*{durationInMonths}" min="1" max="24" placeholder="1 to 24"
                           th:classappend="${#fields.hasErrors('durationInMonths')} ? 'border-error/50' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('durationInMonths')}" th:errors="*{durationInMonths}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Price (₹) <span class="text-error">*</span></label>
                    <input type="number" step="0.01" class="glass-input" th:field="*{price}" placeholder="e.g. 2500"
                           th:classappend="${#fields.hasErrors('price')} ? 'border-error/50' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Error</p>
                </div>
            </div>
            <div class="flex gap-4 mt-8 pt-6 border-t border-white/10">
                <button type="submit" class="btn-primary-neon"><span class="material-symbols-outlined text-[18px]">check</span> Save Plan</button>
                <a th:href="@{/plans}" class="btn-ghost-neon no-underline"><span class="material-symbols-outlined text-[18px]">close</span> Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
