<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">

    <div class="top-header">
        <div>
            <h2>Mark Attendance</h2>
            <span class="breadcrumb"><a th:href="@{/attendance}" class="text-decoration-none">Attendance</a> / Form</span>
        </div>
    </div>

    <div class="content-card" style="max-width: 600px;">
        <div class="card-body">
            <form th:action="@{/attendance/save}" th:object="${attendance}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Select Member <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{member}" th:classappend="${#fields.hasErrors('member')} ? 'is-invalid' : ''">
                        <option value="">-- Choose Member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.phone} + ')'"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{member}">Error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" th:field="*{date}" th:classappend="${#fields.hasErrors('date')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{date}">Error</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Status <span class="text-danger">*</span></label>
                    <div class="d-flex gap-4 mt-1">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{status}" value="Present" id="statusPresent" checked>
                            <label class="form-check-label text-success fw-semibold" for="statusPresent">Present</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" th:field="*{status}" value="Absent" id="statusAbsent">
                            <label class="form-check-label text-danger fw-semibold" for="statusAbsent">Absent</label>
                        </div>
                    </div>
                    <div class="text-danger small mt-1" th:errors="*{status}">Error</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Attendance</button>
                    <a th:href="@{/attendance}" class="btn btn-secondary"><i class="bi bi-x-lg me-1"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
