<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="font-headline-xl text-headline-xl text-primary">Mark Attendance</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">
                <a th:href="@{/attendance}" class="text-secondary-fixed hover:text-secondary no-underline">Attendance</a> / Form
            </p>
        </div>
    </div>
    <div class="glass-panel rounded-xl p-8 max-w-[600px]">
        <form th:action="@{/attendance/save}" th:object="${attendance}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="flex flex-col gap-6">
                <div>
                    <label class="glass-label">Select Member <span class="text-error">*</span></label>
                    <select class="glass-select" th:field="*{member}" th:classappend="${#fields.hasErrors('member')} ? 'border-error/50' : ''">
                        <option value="">-- Choose Member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.phone} + ')'"></option>
                    </select>
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('member')}" th:errors="*{member}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Date <span class="text-error">*</span></label>
                    <input type="date" class="glass-input" th:field="*{date}" th:classappend="${#fields.hasErrors('date')} ? 'border-error/50' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('date')}" th:errors="*{date}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Status <span class="text-error">*</span></label>
                    <div class="flex gap-6 mt-2">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="radio" th:field="*{status}" value="Present" id="statusPresent" class="accent-[#ccff00] w-4 h-4" checked>
                            <span class="font-label-md text-label-md text-primary-fixed group-hover:text-primary-fixed">Present</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="radio" th:field="*{status}" value="Absent" id="statusAbsent" class="accent-[#ffb4ab] w-4 h-4">
                            <span class="font-label-md text-label-md text-error group-hover:text-error">Absent</span>
                        </label>
                    </div>
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Error</p>
                </div>
            </div>
            <div class="flex gap-4 mt-8 pt-6 border-t border-white/10">
                <button type="submit" class="btn-primary-neon"><span class="material-symbols-outlined text-[18px]">check</span> Save Attendance</button>
                <a th:href="@{/attendance}" class="btn-ghost-neon no-underline"><span class="material-symbols-outlined text-[18px]">close</span> Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
