<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">
    <!-- Page Header -->
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="font-headline-xl text-headline-xl text-primary">Member Details</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">
                <a th:href="@{/members}" class="text-secondary-fixed hover:text-secondary no-underline">Members</a> / View
            </p>
        </div>
        <div class="flex gap-3">
            <a th:href="@{/members/edit/{id}(id=${member.id})}" class="btn-primary-neon no-underline">
                <span class="material-symbols-outlined text-[18px]">edit</span>
                Edit
            </a>
            <a th:href="@{/members}" class="btn-ghost-neon no-underline">
                <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                Back
            </a>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-gutter">
        <!-- Member Info -->
        <div class="lg:col-span-2 glass-panel rounded-xl p-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <p class="glass-label">Full Name</p>
                    <p class="font-headline-md text-[20px] text-primary" th:text="${member.name}">John Doe</p>
                </div>
                <div>
                    <p class="glass-label">Phone Number</p>
                    <p class="font-headline-md text-[20px] text-primary" th:text="${member.phone}">9876543210</p>
                </div>
                <div>
                    <p class="glass-label">Email</p>
                    <p class="font-headline-md text-[20px] text-primary" th:text="${member.email ?: 'Not provided'}">email@example.com</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="glass-label">Age</p>
                        <p class="font-headline-md text-[20px] text-primary" th:text="${member.age}">25</p>
                    </div>
                    <div>
                        <p class="glass-label">Gender</p>
                        <span th:classappend="${member.gender == 'Male'} ? 'badge-active' : (${member.gender == 'Female'} ? 'badge-pending' : 'badge-info')"
                              th:text="${member.gender}">Male</span>
                    </div>
                </div>
                <div>
                    <p class="glass-label">Join Date</p>
                    <p class="font-headline-md text-[20px] text-primary" th:text="${#temporals.format(member.joinDate, 'dd MMMM yyyy')}">01 January 2026</p>
                </div>
                <div>
                    <p class="glass-label">Address</p>
                    <p class="font-headline-md text-[20px] text-primary" th:text="${member.address ?: 'Not provided'}">123 Main Street</p>
                </div>
            </div>
        </div>

        <!-- Member Avatar Card -->
        <div class="glass-panel rounded-xl p-8 flex flex-col items-center justify-center text-center">
            <div class="w-24 h-24 rounded-full bg-surface-container-high border-2 border-primary-fixed/30 flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(204,255,0,0.2)]">
                <span class="material-symbols-outlined text-[48px] text-primary-fixed">person</span>
            </div>
            <h3 class="font-headline-md text-headline-md text-primary font-bold" th:text="${member.name}">John Doe</h3>
            <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Member ID: #<span th:text="${member.id}">1</span></p>
        </div>
    </div>
</div>
</body>
</html>
