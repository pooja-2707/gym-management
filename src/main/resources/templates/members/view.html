<!DOCTYPE html>
<!--
=============================================
MEMBER VIEW PAGE (members/view.html)
=============================================
WHY: Shows a single member's complete details in a clean card layout.
This is a READ-ONLY page — no form, no editing.

Admin reaches this page by clicking the "eye" icon on the members list.
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout}">
<body>
<div id="page-content">

    <!-- Page Header -->
    <div class="top-header">
        <div>
            <h2>Member Details</h2>
            <span class="breadcrumb">
                <a th:href="@{/members}" class="text-decoration-none">Members</a> / View
            </span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/members/edit/{id}(id=${member.id})}" class="btn btn-warning">
                <i class="bi bi-pencil me-1"></i> Edit
            </a>
            <a th:href="@{/members}" class="btn btn-secondary">
                <i class="bi bi-arrow-left me-1"></i> Back
            </a>
        </div>
    </div>

    <div class="content-card">
        <div class="card-body">
            <div class="row">
                <!-- Member Info -->
                <div class="col-md-8">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-semibold">Full Name</label>
                                <p class="fs-5 mb-0" th:text="${member.name}">John Doe</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-semibold">Phone Number</label>
                                <p class="fs-5 mb-0" th:text="${member.phone}">9876543210</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-semibold">Email</label>
                                <p class="fs-5 mb-0" th:text="${member.email ?: 'Not provided'}">email@example.com</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-semibold">Age</label>
                                <p class="fs-5 mb-0" th:text="${member.age}">25</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-semibold">Gender</label>
                                <p class="fs-5 mb-0">
                                    <span class="badge" 
                                          th:classappend="${member.gender == 'Male'} ? 'bg-primary' : (${member.gender == 'Female'} ? 'bg-danger' : 'bg-secondary')"
                                          th:text="${member.gender}">Male</span>
                                </p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-semibold">Join Date</label>
                                <p class="fs-5 mb-0" th:text="${#temporals.format(member.joinDate, 'dd MMMM yyyy')}">01 January 2026</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label text-muted fw-semibold">Address</label>
                                <p class="fs-5 mb-0" th:text="${member.address ?: 'Not provided'}">123 Main Street</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Member Avatar/Icon -->
                <div class="col-md-4 text-center">
                    <div class="p-4">
                        <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                             style="width: 120px; height: 120px; font-size: 3rem;"
                             th:style="'width: 120px; height: 120px; font-size: 3rem; background: ' + (${member.gender == 'Male'} ? 'linear-gradient(135deg, #4361ee, #6c63ff)' : (${member.gender == 'Female'} ? 'linear-gradient(135deg, #ef476f, #e17055)' : 'linear-gradient(135deg, #6c757d, #495057)')) + '; color: white;'">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h4 th:text="${member.name}">John Doe</h4>
                        <p class="text-muted">Member ID: #<span th:text="${member.id}">1</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
