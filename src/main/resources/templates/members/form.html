<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">
    <!-- Page Header -->
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="font-headline-xl text-headline-xl text-primary" th:text="${member.id != null} ? 'Edit Member' : 'Add New Member'">Add New Member</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">
                <a th:href="@{/members}" class="text-secondary-fixed hover:text-secondary no-underline">Members</a>
                / <span th:text="${member.id != null} ? 'Edit' : 'Add'">Add</span>
            </p>
        </div>
    </div>

    <!-- Form Card -->
    <div class="glass-panel rounded-xl p-8">
        <form th:action="@{/members/save}" th:object="${member}" method="post" novalidate>
            <input type="hidden" th:field="*{id}">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Name -->
                <div>
                    <label class="glass-label">Full Name <span class="text-error">*</span></label>
                    <input type="text" class="glass-input" th:field="*{name}" placeholder="Enter full name"
                           th:classappend="${#fields.hasErrors('name')} ? 'border-error/50 focus:border-error' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>
                </div>
                <!-- Phone -->
                <div>
                    <label class="glass-label">Phone Number <span class="text-error">*</span></label>
                    <input type="text" class="glass-input" th:field="*{phone}" placeholder="Enter phone number"
                           th:classappend="${#fields.hasErrors('phone')} ? 'border-error/50 focus:border-error' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</p>
                </div>
                <!-- Email -->
                <div>
                    <label class="glass-label">Email</label>
                    <input type="email" class="glass-input" th:field="*{email}" placeholder="Enter email address"
                           th:classappend="${#fields.hasErrors('email')} ? 'border-error/50 focus:border-error' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
                </div>
                <!-- Age -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="glass-label">Age <span class="text-error">*</span></label>
                        <input type="number" class="glass-input" th:field="*{age}" placeholder="Age" min="10" max="100"
                               th:classappend="${#fields.hasErrors('age')} ? 'border-error/50 focus:border-error' : ''">
                        <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age error</p>
                    </div>
                    <div>
                        <label class="glass-label">Gender <span class="text-error">*</span></label>
                        <select class="glass-select" th:field="*{gender}"
                                th:classappend="${#fields.hasErrors('gender')} ? 'border-error/50 focus:border-error' : ''">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                        <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}">Gender error</p>
                    </div>
                </div>
                <!-- Join Date -->
                <div>
                    <label class="glass-label">Join Date <span class="text-error">*</span></label>
                    <input type="date" class="glass-input" th:field="*{joinDate}"
                           th:classappend="${#fields.hasErrors('joinDate')} ? 'border-error/50 focus:border-error' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('joinDate')}" th:errors="*{joinDate}">Join date error</p>
                </div>
                <!-- Address -->
                <div>
                    <label class="glass-label">Address</label>
                    <textarea class="glass-input" th:field="*{address}" rows="3" placeholder="Enter address (optional)"></textarea>
                </div>
            </div>

            <!-- Form Buttons -->
            <div class="flex gap-4 mt-8 pt-6 border-t border-white/10">
                <button type="submit" class="btn-primary-neon">
                    <span class="material-symbols-outlined text-[18px]">check</span>
                    <span th:text="${member.id != null} ? 'Update Member' : 'Save Member'">Save Member</span>
                </button>
                <a th:href="@{/members}" class="btn-ghost-neon no-underline">
                    <span class="material-symbols-outlined text-[18px]">close</span>
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
