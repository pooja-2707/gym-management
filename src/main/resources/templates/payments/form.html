<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">

    <div class="top-header">
        <div>
            <h2 th:text="${payment.id != null} ? 'Edit Payment' : 'Record New Payment'">Record Payment</h2>
            <span class="breadcrumb"><a th:href="@{/payments}" class="text-decoration-none">Payments</a> / Form</span>
        </div>
    </div>

    <div class="content-card" style="max-width: 600px;">
        <div class="card-body">
            <form th:action="@{/payments/save}" th:object="${payment}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Select Member <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{member}" th:classappend="${#fields.hasErrors('member')} ? 'is-invalid' : ''">
                        <option value="">-- Choose Member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.phone} + ')'"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{member}">Error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Amount (₹) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" class="form-control" th:field="*{amount}"
                           th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid' : ''" placeholder="Amount paid">
                    <div class="invalid-feedback" th:errors="*{amount}">Error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Payment Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" th:field="*{paymentDate}" th:classappend="${#fields.hasErrors('paymentDate')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{paymentDate}">Error</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Payment Mode <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{paymentMode}" th:classappend="${#fields.hasErrors('paymentMode')} ? 'is-invalid' : ''">
                        <option value="">-- Select Mode --</option>
                        <option value="Cash">Cash</option>
                        <option value="Card">Card</option>
                        <option value="UPI">UPI</option>
                        <option value="Online">Online</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{paymentMode}">Error</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Payment</button>
                    <a th:href="@{/payments}" class="btn btn-secondary"><i class="bi bi-x-lg me-1"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
