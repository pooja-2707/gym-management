<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="font-headline-xl text-headline-xl text-primary" th:text="${payment.id != null} ? 'Edit Payment' : 'Record New Payment'">Record Payment</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">
                <a th:href="@{/payments}" class="text-secondary-fixed hover:text-secondary no-underline">Payments</a> / Form
            </p>
        </div>
    </div>
    <div class="glass-panel rounded-xl p-8 max-w-[600px]">
        <form th:action="@{/payments/save}" th:object="${payment}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="flex flex-col gap-6">
                <div>
                    <label class="glass-label">Select Member <span class="text-error">*</span></label>
                    <select class="glass-select" th:field="*{member}" th:classappend="${#fields.hasErrors('member')} ? 'border-error/50' : ''">
                        <option value="">-- Choose Member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.phone} + ')'"></option>
                    </select>
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('member')}" th:errors="*{member}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Amount (₹) <span class="text-error">*</span></label>
                    <input type="number" step="0.01" class="glass-input" th:field="*{amount}" placeholder="Amount paid"
                           th:classappend="${#fields.hasErrors('amount')} ? 'border-error/50' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Payment Date <span class="text-error">*</span></label>
                    <input type="date" class="glass-input" th:field="*{paymentDate}" th:classappend="${#fields.hasErrors('paymentDate')} ? 'border-error/50' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('paymentDate')}" th:errors="*{paymentDate}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Payment Mode <span class="text-error">*</span></label>
                    <select class="glass-select" th:field="*{paymentMode}" th:classappend="${#fields.hasErrors('paymentMode')} ? 'border-error/50' : ''">
                        <option value="">-- Select Mode --</option>
                        <option value="Cash">Cash</option>
                        <option value="Card">Card</option>
                        <option value="UPI">UPI</option>
                        <option value="Online">Online</option>
                    </select>
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('paymentMode')}" th:errors="*{paymentMode}">Error</p>
                </div>
            </div>
            <div class="flex gap-4 mt-8 pt-6 border-t border-white/10">
                <button type="submit" class="btn-primary-neon"><span class="material-symbols-outlined text-[18px]">check</span> Save Payment</button>
                <a th:href="@{/payments}" class="btn-ghost-neon no-underline"><span class="material-symbols-outlined text-[18px]">close</span> Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
