<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">

    <div class="top-header">
        <div>
            <h2>Payments</h2>
            <span class="breadcrumb">Track all payment records & revenue</span>
        </div>
        <a th:href="@{/payments/add}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Record Payment
        </a>
    </div>

    <!-- Revenue Summary Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon bg-success text-white rounded-3 fs-3 px-3 py-2">
                    <i class="bi bi-wallet2"></i>
                </div>
                <div>
                    <h4 class="mb-0 fw-bold">₹<span th:text="${#numbers.formatDecimal(totalRevenue ?: 0, 1, 0)}">0</span></h4>
                    <span class="text-muted small">Total Revenue</span>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="stat-card p-3 d-flex align-items-center gap-3">
                <div class="stat-icon bg-info text-white rounded-3 fs-3 px-3 py-2">
                    <i class="bi bi-graph-up-arrow"></i>
                </div>
                <div>
                    <h4 class="mb-0 fw-bold">₹<span th:text="${#numbers.formatDecimal(monthlyRevenue ?: 0, 1, 0)}">0</span></h4>
                    <span class="text-muted small">This Month's Revenue</span>
                </div>
            </div>
        </div>
    </div>

    <div class="content-card">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(payments)}" class="text-center py-4 text-muted">
                No payment records found.
            </div>

            <div th:unless="${#lists.isEmpty(payments)}" class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Member</th>
                            <th>Amount</th>
                            <th>Payment Date</th>
                            <th>Mode</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pay, iterStat : ${payments}">
                            <td th:text="${iterStat.count}">1</td>
                            <td th:text="${pay.member != null ? pay.member.name : 'N/A'}">John Doe</td>
                            <td class="fw-bold text-success">₹<span th:text="${#numbers.formatDecimal(pay.amount, 1, 0)}">1000</span></td>
                            <td th:text="${#temporals.format(pay.paymentDate, 'dd-MMM-yyyy')}">01-Jan-2026</td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${pay.paymentMode}">UPI</span>
                            </td>
                            <td>
                                <a th:href="@{/payments/edit/{id}(id=${pay.id})}" class="btn btn-sm btn-warning me-1">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/payments/delete/{id}(id=${pay.id})}" class="btn btn-sm btn-danger"
                                   onclick="return confirm('Delete this payment record?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
