<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">

    <div class="top-header">
        <div>
            <h2 th:text="${subscription.id != null} ? 'Edit Subscription' : 'Assign Membership Plan'">Assign Subscription</h2>
            <span class="breadcrumb"><a th:href="@{/subscriptions}" class="text-decoration-none">Subscriptions</a> / Form</span>
        </div>
    </div>

    <div class="content-card" style="max-width: 600px;">
        <div class="card-body">
            <form th:action="@{/subscriptions/save}" th:object="${subscription}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Select Member <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{member}" th:classappend="${#fields.hasErrors('member')} ? 'is-invalid' : ''">
                        <option value="">-- Choose Member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.phone} + ')'"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{member}">Error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Plan <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{plan}" th:classappend="${#fields.hasErrors('plan')} ? 'is-invalid' : ''">
                        <option value="">-- Choose Plan --</option>
                        <option th:each="p : ${plans}" th:value="${p.id}" th:text="${p.planName} + ' - ' + ${p.durationInMonths} + ' Mo. (₹' + ${#numbers.formatDecimal(p.price, 1, 0)} + ')'"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{plan}">Error</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Start Date <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" th:field="*{startDate}" th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid' : ''">
                    <div class="invalid-feedback" th:errors="*{startDate}">Error</div>
                    <small class="text-muted">End Date and Status will be auto-calculated.</small>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Subscription</button>
                    <a th:href="@{/subscriptions}" class="btn btn-secondary"><i class="bi bi-x-lg me-1"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
