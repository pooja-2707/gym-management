<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">
    <div class="flex justify-between items-end mb-8">
        <div>
            <h2 class="font-headline-xl text-headline-xl text-primary" th:text="${subscription.id != null} ? 'Edit Subscription' : 'Assign Membership Plan'">Assign Subscription</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">
                <a th:href="@{/subscriptions}" class="text-secondary-fixed hover:text-secondary no-underline">Subscriptions</a> / Form
            </p>
        </div>
    </div>
    <div class="glass-panel rounded-xl p-8 max-w-[600px]">
        <form th:action="@{/subscriptions/save}" th:object="${subscription}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="flex flex-col gap-6">
                <div>
                    <label class="glass-label">Select Member <span class="text-error">*</span></label>
                    <select class="glass-select" th:field="*{member}" th:classappend="${#fields.hasErrors('member')} ? 'border-error/50' : ''">
                        <option value="">-- Choose Member --</option>
                        <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name} + ' (' + ${m.phone} + ')'"></option>
                    </select>
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('member')}" th:errors="*{member}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Select Plan <span class="text-error">*</span></label>
                    <select class="glass-select" th:field="*{plan}" th:classappend="${#fields.hasErrors('plan')} ? 'border-error/50' : ''">
                        <option value="">-- Choose Plan --</option>
                        <option th:each="p : ${plans}" th:value="${p.id}" th:text="${p.planName} + ' - ' + ${p.durationInMonths} + ' Mo. (₹' + ${#numbers.formatDecimal(p.price, 1, 0)} + ')'"></option>
                    </select>
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('plan')}" th:errors="*{plan}">Error</p>
                </div>
                <div>
                    <label class="glass-label">Start Date <span class="text-error">*</span></label>
                    <input type="date" class="glass-input" th:field="*{startDate}" th:classappend="${#fields.hasErrors('startDate')} ? 'border-error/50' : ''">
                    <p class="text-error text-[12px] mt-1" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}">Error</p>
                    <p class="font-label-sm text-label-sm text-on-surface-variant mt-1">End Date and Status will be auto-calculated.</p>
                </div>
            </div>
            <div class="flex gap-4 mt-8 pt-6 border-t border-white/10">
                <button type="submit" class="btn-primary-neon"><span class="material-symbols-outlined text-[18px]">check</span> Save Subscription</button>
                <a th:href="@{/subscriptions}" class="btn-ghost-neon no-underline"><span class="material-symbols-outlined text-[18px]">close</span> Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
