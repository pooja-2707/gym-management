<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout}">
<body>
<div id="page-content">

    <div class="top-header">
        <div>
            <h2 th:text="${trainer.id != null} ? 'Edit Trainer' : 'Add New Trainer'">Add Trainer</h2>
            <span class="breadcrumb"><a th:href="@{/trainers}" class="text-decoration-none">Trainers</a> / Form</span>
        </div>
    </div>

    <div class="content-card" style="max-width: 600px;">
        <div class="card-body">
            <form th:action="@{/trainers/save}" th:object="${trainer}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label">Trainer Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Full name">
                    <div class="invalid-feedback" th:errors="*{name}">Error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{phone}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''" placeholder="Phone number">
                    <div class="invalid-feedback" th:errors="*{phone}">Error</div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Specialization <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{specialization}"
                           th:classappend="${#fields.hasErrors('specialization')} ? 'is-invalid' : ''" placeholder="e.g. Cardio, Yoga, CrossFit">
                    <div class="invalid-feedback" th:errors="*{specialization}">Error</div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Monthly Salary (₹) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" class="form-control" th:field="*{salary}"
                           th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''" placeholder="e.g. 35000">
                    <div class="invalid-feedback" th:errors="*{salary}">Error</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Save Trainer</button>
                    <a th:href="@{/trainers}" class="btn btn-secondary"><i class="bi bi-x-lg me-1"></i> Cancel</a>
                </div>
            </form>
        </div>
    </div>

</div>
</body>
</html>
